name: fuseone-build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fuseone-io/ingress-nginx
  ARCH: amd64

jobs:
  nginx-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push nginx base
        run: |
          TAG="$(cat images/nginx/TAG)"
          docker buildx build --platform linux/amd64 --push \
            -t "${REGISTRY}/nginx:${TAG}" images/nginx/rootfs

  controller:
    needs: nginx-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile controller binaries
        run: make build
      - name: Build & push controller image
        run: |
          TAG="$(cat TAG)"
          make image REGISTRY="${REGISTRY}" ARCH="${ARCH}"
          docker push "${REGISTRY}/controller:${TAG}"
